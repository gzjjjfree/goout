name: Cross Platform Release

on:
  push:
    tags:
      - "v*" # 当推送 v1.0.0 等标签时触发
  workflow_dispatch: # 手动触发
    inputs:
      target_os:
        description: "Select OS to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - android
          - macos
          - linux
      version:
        description: "App Version (e.g. 1.0.10, leave empty to auto-detect)"
        required: false
        type: string

# 强制赋予当前工作流的 GITHUB_TOKEN 写入 Release 的权限
permissions:
  contents: write

jobs:
  build-android:
    if: ${{ github.event_name == 'push' || github.event.inputs.target_os == 'all' || github.event.inputs.target_os == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Android (Native Mode)
        env:
          K_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          K_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: "goout-alias"
        run: |
          RAW_VERSION="${{ github.event.inputs.version }}"
          if [ -z "$RAW_VERSION" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION=$(python3 -c 'import re; c=open("FyneApp.toml").read(); m=re.search(r"^version\s*=\s*\"([^\"]+)\"", c, re.M); print(m.group(1) if m else "1.0.0")')
          fi
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION=$(python3 -c 'import re; c=open("FyneApp.toml").read(); m=re.search(r"^version\s*=\s*\"([^\"]+)\"", c, re.M); print(m.group(1) if m else "1.0.0")')
          fi

          BUILD_ID=$(git rev-list --count HEAD 2>/dev/null || echo "${{ github.run_number }}")
          if [ -z "$BUILD_ID" ] || ! [[ "$BUILD_ID" =~ ^[0-9]+$ ]]; then
            BUILD_ID="${{ github.run_number }}"
          fi
          python3 -c 'import sys,re; f="FyneApp.toml"; c=open(f).read(); c=re.sub(r"^version\s*=.*", f"version = \"{sys.argv[1]}\"", c, flags=re.M); c=re.sub(r"^build\s*=.*", f"build = {sys.argv[2]}", c, flags=re.M); open(f,"w").write(c)' "$CLEAN_VERSION" "$BUILD_ID"

          BT_VERSION="1.17.0"
          curl -L -o bundletool.jar https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar
          printf "#!/bin/bash\njava -jar $(pwd)/bundletool.jar \"\$@\"" > bundletool
          chmod +x bundletool
          export PATH=$PATH:$(pwd)

          echo "$K_BASE64" | base64 -d > release.keystore
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)

          fyne release -os android/arm64 \
            -appID com.gzjjjfree.goout \
            -icon Icon.png \
            -keyStore release.keystore \
            -keyStorePass "$K_PASS" \
            -keyPass "$K_PASS" \
            -appVersion "$CLEAN_VERSION" \
            -appBuild "$BUILD_ID" \
            -keyName "$K_ALIAS" \
            -name GoOut
          ./bundletool build-apks --bundle=GoOut.aab --output=GoOut.apks --mode=universal --ks=release.keystore --ks-pass=pass:"$K_PASS" --ks-key-alias="$K_ALIAS" --key-pass=pass:"$K_PASS"
          unzip -p GoOut.apks universal.apk > GoOut_Native.apk
          mv GoOut.aab GoOut_Native.aab

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            *.apk
            *.aab

  build-macos:
    if: ${{ github.event_name == 'push' || github.event.inputs.target_os == 'all' || github.event.inputs.target_os == 'macos' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build macOS (ARM64)
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="1.0.0"
          fi
          python3 -c 'import sys,re; f="FyneApp.toml"; c=open(f).read(); open(f,"w").write(re.sub(r"^version\s*=.*", f"version = \"{sys.argv[1]}\"", c, flags=re.M))' "$CLEAN_VERSION"
          fyne package -os darwin -name GoOut -icon Icon.png --appVersion "$CLEAN_VERSION"
          zip -r GoOut_macOS_arm64.zip GoOut.app

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: "*.zip"

  build-windows:
    if: ${{ github.event_name == 'push' || github.event.inputs.target_os == 'all' || github.event.inputs.target_os == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Windows (Package Mode)
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="1.0.0"
          fi
          python3 -c 'import sys,re; f="FyneApp.toml"; c=open(f).read(); open(f,"w").write(re.sub(r"^version\s*=.*", f"version = \"{sys.argv[1]}\"", c, flags=re.M))' "$CLEAN_VERSION"
          fyne package -os windows -name GoOut -icon Icon.png --appID com.gzjjjfree.goout --appVersion "$CLEAN_VERSION"

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: GoOut.exe

  build-linux:
    if: ${{ github.event_name == 'push' || github.event.inputs.target_os == 'all' || github.event.inputs.target_os == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Install Linux Graphics Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build Linux Binary
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="1.0.0"
          fi
          go build -ldflags="-X github.com/gzjjjfree/goout/ui.Version=$CLEAN_VERSION" -o GoOut_linux_amd64 main.go

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: GoOut_linux_amd64

  create-release:
    needs: [build-android, build-macos, build-windows, build-linux]
    if: always() # 确保即使部分任务被跳过，release 也能根据成功的产物继续执行
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Organize and Rename Assets
        run: |
          mkdir -p release_assets
          # 使用 || true 防止某个平台没构建导致 cp 报错中断
          cp android-apk/GoOut_Native.apk release_assets/GoOut.apk 2>/dev/null || true
          cp android-apk/GoOut_Native.aab release_assets/GoOut.aab 2>/dev/null || true
          cp macos-app/*.zip release_assets/ 2>/dev/null || true
          cp windows-exe/GoOut.exe release_assets/GoOut_Windows_x64.exe 2>/dev/null || true
          cp linux-binary/GoOut_linux_amd64 release_assets/GoOut_Linux_amd64 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
