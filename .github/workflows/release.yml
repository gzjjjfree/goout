name: Cross Platform Release

on:
  push:
    tags:
      - "v*" # 当推送 v1.0.0 等标签时触发
  workflow_dispatch: # 手动触发
    inputs:
      version:
        description: "App Version (e.g. 1.0.10, leave empty to auto-detect)"
        required: false
        type: string

# 强制赋予当前工作流的 GITHUB_TOKEN 写入 Release 的权限
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 关键修复：显式指定安装 ndk 和 build-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Android (Native Mode)
        env:
          K_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          K_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: "goout-alias"
        run: |
          # 1. 确定版本号
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi

          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="1.0.0"
          fi

          BUILD_ID=$(git rev-list --count HEAD 2>/dev/null || echo "${{ github.run_number }}")
          if [ -z "$BUILD_ID" ] || ! [[ "$BUILD_ID" =~ ^[0-9]+$ ]]; then
            BUILD_ID="${{ github.run_number }}"
          fi

          echo "Final App Version: $CLEAN_VERSION"
          echo "Final Build ID (VersionCode): $BUILD_ID"

          python3 -c 'import sys,re; f="FyneApp.toml"; c=open(f).read(); c=re.sub(r"^version\s*=.*", f"version = \"{sys.argv[1]}\"", c, flags=re.M); c=re.sub(r"^build\s*=.*", f"build = {sys.argv[2]}", c, flags=re.M); open(f,"w").write(c)' "$CLEAN_VERSION" "$BUILD_ID"

          # 2. 还原 Keystore
          echo "$K_BASE64" | base64 -d > release.keystore

          export ANDROID_HOME=$ANDROID_SDK_ROOT

          # 更安全的 NDK 路径查找，如果找不到则打印提示并退出
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | tail -1)
          if [ -z "$NDK_PATH" ]; then
            echo "Error: Android NDK not found!"
            exit 1
          fi
          export ANDROID_NDK_HOME="$NDK_PATH"
          echo "Using Android NDK: $ANDROID_NDK_HOME"

          # 3. 使用 fyne package 直接生成基础 APK
          GOFLAGS="-ldflags=-s -w" fyne package -os android/arm64 \
            -appID com.gzjjjfree.goout \
            -icon Icon.png \
            -appVersion "$CLEAN_VERSION" \
            -appBuild "$BUILD_ID" \
            -name GoOut

          TARGET_APK=$(ls *.apk | head -n 1)
          echo "Generated APK: $TARGET_APK"

          # 4. 寻找 SDK 中的 zipalign 和 apksigner 工具并进行对齐与签名
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # 对齐
          $ZIPALIGN -v -p 4 "$TARGET_APK" aligned.apk

          # 签名
          $APKSIGNER sign --ks release.keystore \
            --ks-key-alias "goout-alias" \
            --ks-pass "pass:$K_PASS" \
            --key-pass "pass:$K_PASS" \
            --out GoOut_Native.apk aligned.apk

          # 清理临时文件
          rm -f aligned.apk "$TARGET_APK"

          echo "Success! GoOut_Native.apk has been generated successfully."

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            *.apk
            *.aab

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build macOS (ARM64)
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi

          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="1.0.0"
          fi

          echo "Final App Version: $CLEAN_VERSION"

          # 同步更新 FyneApp.toml 中的版本号（单行跨平台 Python 脚本）
          python3 -c 'import sys,re; f="FyneApp.toml"; c=open(f).read(); open(f,"w").write(re.sub(r"^version\s*=.*", f"version = \"{sys.argv[1]}\"", c, flags=re.M))' "$CLEAN_VERSION"

          fyne package -os darwin -name GoOut -icon Icon.png --appVersion "$CLEAN_VERSION"
          zip -r GoOut_macOS_arm64.zip GoOut.app

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: "*.zip"

  create-release:
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Organize and Rename Assets
        run: |
          mkdir -p release_assets

          cp android-apk/GoOut_Native.apk release_assets/GoOut.apk
          # cp android-apk/GoOut_Native.aab release_assets/GoOut.aab

          cp macos-app/*.zip release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
