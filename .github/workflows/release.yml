name: Cross Platform Release

on:
  push:
    tags:
      - "v*" # 当推送 v1.0.0 等标签时触发
  workflow_dispatch: # 手动触发
    inputs:
      target_os:
        description: "Select OS to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - android
          - macos
          - linux
      version:
        description: "App Version (e.g. 1.0.10, leave empty to auto-detect)"
        required: false
        type: string

# 强制赋予当前工作流的 GITHUB_TOKEN 写入 Release 的权限
permissions:
  contents: write

jobs:
  build-android:
    if: ${{ github.event_name == 'push' || github.event.inputs.target_os == 'all' || github.event.inputs.target_os == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Fyne CLI Binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-fyne-cli-v2
          restore-keys: |
            ${{ runner.os }}-fyne-cli-

      - name: Cache Apktool and Bundletool JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/android-build-tools
          key: android-build-jars-apktool-2.9.3-bundletool-1.17.0

      - name: Install Fyne CLI
        run: |
          export PATH="$HOME/go/bin:$(go env GOPATH)/bin:$PATH"
          if ! command -v fyne >/dev/null 2>&1; then
            go install fyne.io/fyne/v2/cmd/fyne@latest
          fi

      - name: Build Android (Native Mode & Inject VpnService)
        env:
          K_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          K_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: "goout-alias"
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$(go env GOPATH)/bin:$PATH"

          # 1. 解析与写入版本号及 Build ID
          RAW_VERSION="${{ github.event.inputs.version }}"
          if [ -z "$RAW_VERSION" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION=$(python3 -c 'import re; c=open("FyneApp.toml").read(); m=re.search(r"^[vV]ersion\s*=\s*\"([^\"]+)\"", c, re.M); print(m.group(1) if m else "1.0.0")')
          fi
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION=$(python3 -c 'import re; c=open("FyneApp.toml").read(); m=re.search(r"^[vV]ersion\s*=\s*\"([^\"]+)\"", c, re.M); print(m.group(1) if m else "1.0.0")')
          fi

          BUILD_ID=$(git rev-list --count HEAD 2>/dev/null || echo "${{ github.run_number }}")
          if [ -z "$BUILD_ID" ] || ! [[ "$BUILD_ID" =~ ^[0-9]+$ ]]; then
            BUILD_ID="${{ github.run_number }}"
          fi
          python3 -c 'import sys,re; f="FyneApp.toml"; c=open(f).read(); c=re.sub(r"^[vV]ersion\s*=.*", f"Version = \"{sys.argv[1]}\"", c, flags=re.M); c=re.sub(r"^[bB]uild\s*=.*", f"Build = {sys.argv[2]}", c, flags=re.M); open(f,"w").write(c)' "$CLEAN_VERSION" "$BUILD_ID"

          # 2. 准备缓存工具与 Android SDK 路径
          ROOT_DIR="$(pwd)"
          WORK_DIR="$ROOT_DIR/work"
          CACHE_DIR="$HOME/.cache/android-build-tools"
          mkdir -p "$CACHE_DIR" "$WORK_DIR" "$WORK_DIR/compiled"

          BT_VERSION="1.17.0"
          BUNDLETOOL_CACHE="$CACHE_DIR/bundletool-all-${BT_VERSION}.jar"
          if [ ! -s "$BUNDLETOOL_CACHE" ]; then
            curl -fL --retry 3 --retry-delay 2 \
              -o "${BUNDLETOOL_CACHE}.tmp" \
              "https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar"
            unzip -t "${BUNDLETOOL_CACHE}.tmp" >/dev/null
            mv "${BUNDLETOOL_CACHE}.tmp" "$BUNDLETOOL_CACHE"
          fi
          cp "$BUNDLETOOL_CACHE" "$ROOT_DIR/bundletool.jar"
          printf "#!/bin/bash\njava -jar \"%s/bundletool.jar\" \"\$@\"\n" "$ROOT_DIR" > "$ROOT_DIR/bundletool"
          chmod +x "$ROOT_DIR/bundletool"

          APKTOOL_VERSION="2.9.3"
          APKTOOL_CACHE="$CACHE_DIR/apktool_${APKTOOL_VERSION}.jar"
          APKTOOL_JAR="$WORK_DIR/apktool.jar"
          if [ ! -s "$APKTOOL_CACHE" ]; then
            curl -fL --retry 3 --retry-delay 2 \
              -o "${APKTOOL_CACHE}.tmp" \
              "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
            unzip -t "${APKTOOL_CACHE}.tmp" >/dev/null
            mv "${APKTOOL_CACHE}.tmp" "$APKTOOL_CACHE"
          fi
          cp "$APKTOOL_CACHE" "$APKTOOL_JAR"

          echo "$K_BASE64" | base64 -d > "$ROOT_DIR/release.keystore"
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          export ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | tail -1 || true)

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
            ANDROID_PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          else
            ANDROID_PLATFORM=$(ls "$ANDROID_HOME"/platforms/*/android.jar 2>/dev/null | sort -V | tail -1)
          fi

          D8="$BUILD_TOOLS_DIR/d8"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          export PATH="$BUILD_TOOLS_DIR:$ROOT_DIR:$PATH"

          # 3. 构建 AAB 并提取通用 APK 作为基础包
          fyne release -os android/arm64 \
            -appID com.gzjjjfree.goout \
            -icon Icon.png \
            -keyStore "$ROOT_DIR/release.keystore" \
            -keyStorePass "$K_PASS" \
            -keyPass "$K_PASS" \
            -appVersion "$CLEAN_VERSION" \
            -appBuild "$BUILD_ID" \
            -keyName "$K_ALIAS" \
            -name GoOut

          bundletool build-apks \
            --bundle="$ROOT_DIR/GoOut.aab" \
            --output="$ROOT_DIR/GoOut.apks" \
            --mode=universal \
            --ks="$ROOT_DIR/release.keystore" \
            --ks-pass=pass:"$K_PASS" \
            --ks-key-alias="$K_ALIAS" \
            --key-pass=pass:"$K_PASS"

          APK_SRC="$ROOT_DIR/goout.apk"
          unzip -p "$ROOT_DIR/GoOut.apks" universal.apk > "$APK_SRC"
          mv "$ROOT_DIR/GoOut.aab" "$ROOT_DIR/GoOut_Native.aab"

          # 4. 编译 GoOutVpnService.java 并与 classes.dex 合并
          JAVA_SRC="$ROOT_DIR/android/app/src/main/java/com/gzjjjfree/goout/GoOutVpnService.java"
          COMPILED_DIR="$WORK_DIR/compiled"
          CLASSES_DEX="$WORK_DIR/classes.dex"
          PKGBASE="$WORK_DIR/pkgbase"
          OUTDEX="$WORK_DIR/outdex"
          MERGED_DEX="$WORK_DIR/merged.dex"

          javac -cp "$ANDROID_PLATFORM" -d "$COMPILED_DIR" "$JAVA_SRC"
          ls -l "$COMPILED_DIR/com/gzjjjfree/goout/GoOutVpnService.class"

          unzip -p "$APK_SRC" classes.dex > "$CLASSES_DEX"
          rm -rf "$PKGBASE" "$OUTDEX"
          mkdir -p "$PKGBASE/com/gzjjjfree/goout" "$OUTDEX"
          cp "$COMPILED_DIR/com/gzjjjfree/goout/GoOutVpnService"*".class" "$PKGBASE/com/gzjjjfree/goout/"

          (
            cd "$PKGBASE"
            "$D8" --output "$OUTDEX" --lib "$ANDROID_PLATFORM" \
                  "$CLASSES_DEX" \
                  com/gzjjjfree/goout/GoOutVpnService*.class
          )

          cp "$OUTDEX/classes.dex" "$MERGED_DEX"
          strings "$MERGED_DEX" | grep -q "GoOutVpnService"

          # 5. 解码 APK、注入 VpnService 清单声明并替换 classes.dex
          DECODED_DIR="$WORK_DIR/decoded"
          BUILT_APK="$WORK_DIR/built.apk"
          ALIGNED_APK="$WORK_DIR/built-aligned.apk"
          FINAL_APK="$WORK_DIR/built-final.apk"
          VERIFY_DIR="$WORK_DIR/verify_built"

          rm -rf "$DECODED_DIR"
          java -jar "$APKTOOL_JAR" d -f "$APK_SRC" -o "$DECODED_DIR"
          ls "$DECODED_DIR/AndroidManifest.xml"

          MANIFEST_PATH="$DECODED_DIR/AndroidManifest.xml" SERVICE_NAME=".GoOutVpnService" python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          manifest_path = os.environ["MANIFEST_PATH"]
          service_name = os.environ["SERVICE_NAME"]

          if not os.path.isfile(manifest_path):
              print(f"错误：找不到清单文件 {manifest_path}", file=sys.stderr)
              sys.exit(1)

          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)

          tree = ET.parse(manifest_path)
          root = tree.getroot()
          app_elem = root.find("application")

          if app_elem is None:
              print("错误：AndroidManifest.xml 中未找到 <application> 节点", file=sys.stderr)
              sys.exit(1)

          attr_name = f"{{{ANDROID_NS}}}name"
          short_name = service_name.lstrip(".")

          for svc_elem in app_elem.findall("service"):
              existing = svc_elem.attrib.get(attr_name, "")
              if existing == service_name or existing.endswith("." + short_name):
                  print("manifest 已有 service，跳过")
                  sys.exit(0)

          svc_elem = ET.SubElement(
              app_elem,
              "service",
              {
                  f"{{{ANDROID_NS}}}name": service_name,
                  f"{{{ANDROID_NS}}}permission": "android.permission.BIND_VPN_SERVICE",
                  f"{{{ANDROID_NS}}}exported": "true",
              },
          )
          intent_filter = ET.SubElement(svc_elem, "intent-filter")
          ET.SubElement(intent_filter, "action", {f"{{{ANDROID_NS}}}name": "android.net.VpnService"})

          if hasattr(ET, "indent"):
              ET.indent(tree, space="    ")

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          print("manifest 已注入 service")
          PY

          cp "$MERGED_DEX" "$DECODED_DIR/classes.dex"
          ls -l "$DECODED_DIR/classes.dex"

          # 6. 回编、验证清单、对齐与签名
          java -jar "$APKTOOL_JAR" b "$DECODED_DIR" -o "$BUILT_APK"

          rm -rf "$VERIFY_DIR"
          java -jar "$APKTOOL_JAR" d -f -s "$BUILT_APK" -o "$VERIFY_DIR"
          grep -n -C 5 "GoOutVpnService" "$VERIFY_DIR/AndroidManifest.xml"

          rm -f "$ALIGNED_APK" "$FINAL_APK"
          "$ZIPALIGN" -f -v 4 "$BUILT_APK" "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$ROOT_DIR/release.keystore" \
            --ks-pass pass:"$K_PASS" \
            --ks-key-alias "$K_ALIAS" \
            --key-pass pass:"$K_PASS" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose "$FINAL_APK"

          # 7. 输出最终 APK 并清理临时文件
          cp "$FINAL_APK" "$ROOT_DIR/GoOut_Native.apk"
          rm -rf "$WORK_DIR" "$APK_SRC" "$ROOT_DIR/GoOut.apks" "$ROOT_DIR/release.keystore" "$ROOT_DIR/bundletool" "$ROOT_DIR/bundletool.jar"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            GoOut_Native.apk
            GoOut_Native.aab

  build-macos:
    if: ${{ github.event_name == 'push' || github.event.inputs.target_os == 'all' || github.event.inputs.target_os == 'macos' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Cache Fyne CLI Binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-fyne-cli-v2
          restore-keys: |
            ${{ runner.os }}-fyne-cli-

      - name: Install Fyne CLI
        run: |
          export PATH="$HOME/go/bin:$(go env GOPATH)/bin:$PATH"
          if ! command -v fyne >/dev/null 2>&1; then
            go install fyne.io/fyne/v2/cmd/fyne@latest
          fi

      - name: Build macOS (ARM64)
        run: |
          export PATH="$HOME/go/bin:$(go env GOPATH)/bin:$PATH"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="1.0.0"
          fi
          python3 -c 'import sys,re; f="FyneApp.toml"; c=open(f).read(); open(f,"w").write(re.sub(r"^[vV]ersion\s*=.*", f"Version = \"{sys.argv[1]}\"", c, flags=re.M))' "$CLEAN_VERSION"
          fyne package -os darwin -name GoOut -icon Icon.png --appVersion "$CLEAN_VERSION"
          zip -r GoOut_macOS_arm64.zip GoOut.app

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: "*.zip"

  build-windows:
    if: ${{ github.event_name == 'push' || github.event.inputs.target_os == 'all' || github.event.inputs.target_os == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Cache Fyne CLI Binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-fyne-cli-v2
          restore-keys: |
            ${{ runner.os }}-fyne-cli-

      - name: Install Fyne CLI
        shell: bash
        run: |
          export PATH="$HOME/go/bin:$(go env GOPATH)/bin:$PATH"
          if ! command -v fyne >/dev/null 2>&1; then
            go install fyne.io/fyne/v2/cmd/fyne@latest
          fi

      - name: Build Windows (Package Mode)
        shell: bash
        run: |
          export PATH="$HOME/go/bin:$(go env GOPATH)/bin:$PATH"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="1.0.0"
          fi
          python3 -c 'import sys,re; f="FyneApp.toml"; c=open(f).read(); open(f,"w").write(re.sub(r"^[vV]ersion\s*=.*", f"Version = \"{sys.argv[1]}\"", c, flags=re.M))' "$CLEAN_VERSION"
          fyne package -os windows -name GoOut -icon Icon.png --appID com.gzjjjfree.goout --appVersion "$CLEAN_VERSION"

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: GoOut.exe

  build-linux:
    if: ${{ github.event_name == 'push' || github.event.inputs.target_os == 'all' || github.event.inputs.target_os == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Cache Fyne CLI Binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-fyne-cli-v2
          restore-keys: |
            ${{ runner.os }}-fyne-cli-

      - name: Install Fyne CLI
        run: |
          export PATH="$HOME/go/bin:$(go env GOPATH)/bin:$PATH"
          if ! command -v fyne >/dev/null 2>&1; then
            go install fyne.io/fyne/v2/cmd/fyne@latest
          fi

      - name: Install Linux Graphics Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build Linux Binary
        run: |
          export PATH="$HOME/go/bin:$(go env GOPATH)/bin:$PATH"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="1.0.0"
          fi
          go build -ldflags="-X github.com/gzjjjfree/goout/ui.Version=$CLEAN_VERSION" -o GoOut_linux_amd64 main.go

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: GoOut_linux_amd64

  create-release:
    needs: [build-android, build-macos, build-windows, build-linux]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Organize and Rename Assets
        run: |
          mkdir -p release_assets
          cp android-apk/GoOut_Native.apk release_assets/GoOut.apk 2>/dev/null || true
          cp android-apk/GoOut_Native.aab release_assets/GoOut.aab 2>/dev/null || true
          cp macos-app/*.zip release_assets/ 2>/dev/null || true
          cp windows-exe/GoOut.exe release_assets/GoOut_Windows_x64.exe 2>/dev/null || true
          cp linux-binary/GoOut_linux_amd64 release_assets/GoOut_Linux_amd64 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
