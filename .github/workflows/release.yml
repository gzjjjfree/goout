name: Cross Platform Release

on:
  push:
    tags:
      - "v*" # 当推送 v1.0.0 等标签时触发
  workflow_dispatch: # 手动触发
    inputs:
      version:
        description: 'App Version (e.g. 1.0.10, leave empty to auto-detect)'
        required: false
        type: string

# 强制赋予当前工作流的 GITHUB_TOKEN 写入 Release 的权限
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Set up Java
        # 签名工具 apksigner 需要 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Android (Native Mode)
        env:
          K_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          K_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: "goout-alias"
        run: |
          # 1. 确定版本号：优先使用手动触发输入 -> 其次使用 Git Tag -> 最后通过 git describe 自动推导
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi

          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="1.0.0"
          fi
          
          # Android versionCode 必须为整数，使用 git 提交总数作为自增构建号（或 fallback 到 github.run_number）
          BUILD_ID=$(git rev-list --count HEAD 2>/dev/null || echo "${{ github.run_number }}")
          if [ -z "$BUILD_ID" ] || ! [[ "$BUILD_ID" =~ ^[0-9]+$ ]]; then
            BUILD_ID="${{ github.run_number }}"
          fi

          echo "Final App Version: $CLEAN_VERSION"
          echo "Final Build ID (VersionCode): $BUILD_ID"

          # 同步更新 FyneApp.toml 中的版本号和构建号，确保 Fyne 编译时正确打包该版本
          sed -i 's/^version = .*/version = "'$CLEAN_VERSION'"/' FyneApp.toml
          sed -i 's/^build = .*/build = '$BUILD_ID'/' FyneApp.toml

          # 2. 手动下载 bundletool (Google 官方)
          BT_VERSION="1.17.0"
          curl -L -o bundletool.jar https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar

          # 3. 创建一个命令脚本，让 fyne 能够通过 "bundletool" 这个名字调用它
          printf "#!/bin/bash\njava -jar $(pwd)/bundletool.jar \"\$@\"" > bundletool
          chmod +x bundletool
          export PATH=$PATH:$(pwd)

          # 验证 bundletool 是否可用
          ./bundletool version

          # 4. 还原 Keystore
          echo "$K_BASE64" | base64 -d > release.keystore

          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -1)

          # 5. 使用 release 命令进行正式打包
          fyne release -os android/arm64 \
            -appID com.gzjjjfree.goout \
            -icon Icon.png \
            -keyStore release.keystore \
            -keyStorePass "$K_PASS" \
            -keyPass "$K_PASS" \
            -appVersion "$CLEAN_VERSION" \
            -appBuild "$BUILD_ID" \
            -keyName "$K_ALIAS" \
            -name GoOut

          # 使用 bundletool 生成包含通用 APK 的 apks 压缩包
          ./bundletool build-apks --bundle=GoOut.aab --output=GoOut.apks --mode=universal --ks=release.keystore --ks-pass=pass:"$K_PASS" --ks-key-alias="$K_ALIAS" --key-pass=pass:"$K_PASS"

          # 从 .apks 中提取出真正的 .apk 文件
          unzip -p GoOut.apks universal.apk > GoOut_Native.apk

          echo "Success! GoOut_Native.apk has been generated."

          mv GoOut.aab GoOut_Native.aab

          echo "Success! Native artifacts renamed."

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            *.apk
            *.aab

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build macOS (ARM64)
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          else
            RAW_VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
          fi

          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          if [ -z "$CLEAN_VERSION" ] || ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN_VERSION="1.0.0"
          fi

          echo "Final App Version: $CLEAN_VERSION"

          # 同步更新 FyneApp.toml 中的版本号
          sed -i 's/^version = .*/version = "'$CLEAN_VERSION'"/' FyneApp.toml

          fyne package -os darwin -name GoOut -icon Icon.png --appVersion "$CLEAN_VERSION"
          zip -r GoOut_macOS_arm64.zip GoOut.app

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: "*.zip"

  create-release:
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Organize and Rename Assets
        run: |
          mkdir -p release_assets

          cp android-apk/GoOut_Native.apk release_assets/GoOut.apk
          cp android-apk/GoOut_Native.aab release_assets/GoOut.aab

          cp macos-app/*.zip release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
